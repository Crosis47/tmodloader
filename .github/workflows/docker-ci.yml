name: Docker CI

on:
  push:
    branches-ignore:
      - master
    paths:
      - VERSION
      - "*backup.py"
      - "admin_*.py"
      - workshop_download.py
      - "web/**"
      - CHANGELOG.md
      - Dockerfile
      - "*.sh"
      - "tests/**"
      - docker-compose.yml
      - ".github/workflows/*.yml"
  pull_request:
    paths:
      - VERSION
      - "*backup.py"
      - "admin_*.py"
      - workshop_download.py
      - "web/**"
      - CHANGELOG.md
      - Dockerfile
      - "*.sh"
      - "tests/**"
      - docker-compose.yml
      - ".github/workflows/*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate shell syntax
        run: bash -n ./*.sh tests/*.sh

      - name: Test backup and restore safety
        run: python3 -m unittest discover -s tests -p 'test_backup*.py' -v

      - name: Test administration API safety
        run: python3 -m unittest discover -s tests -p 'test_admin.py' -v

      - name: Test native Workshop cache safety
        run: python3 -m unittest discover -s tests -p 'test_workshop_download.py' -v

      - name: Validate administration JavaScript
        run: node --check web/app.js

      - name: Lint runtime scripts
        run: shellcheck --severity=warning autosave.sh container-init.sh entrypoint.sh healthcheck.sh inject.sh log-filter.sh manage-mods.sh prepare-config.sh release-metadata.sh release-notes.sh run-server.sh steamcmd-wrapper.sh tests/*.sh

      - name: Test release metadata and notes
        run: bash tests/release-metadata-test.sh

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Set up build emulation
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: tmodloader:ci
          cache-from: type=gha,scope=ci-${{ matrix.arch }}

      - name: Verify native runtime architecture
        run: >-
          docker run --rm --user tml:tml --entrypoint bash
          --mount type=bind,source="$PWD",target=/repo,readonly
          tmodloader:ci /repo/tests/architecture-test.sh

      - name: Test Workshop mod management
        run: >-
          docker run --rm --user tml:tml --entrypoint bash
          --mount type=bind,source="$PWD",target=/repo,readonly
          tmodloader:ci
          /repo/tests/manage-mods-test.sh /terraria-server/manage-mods.sh

      - name: Test live Workshop download and cache reuse
        run: >-
          docker run --rm --user tml:tml --entrypoint bash
          --mount type=bind,source="$PWD",target=/repo,readonly
          tmodloader:ci /repo/tests/workshop-download-test.sh

      - name: Test downloader locale
        run: >-
          docker run --rm --user tml:tml --entrypoint bash
          --mount type=bind,source="$PWD",target=/repo,readonly
          tmodloader:ci
          /repo/tests/locale-test.sh /usr/bin/steamcmd

      - name: Test configuration generation
        run: >-
          docker run --rm --user tml:tml --entrypoint bash
          --mount type=bind,source="$PWD",target=/repo,readonly
          tmodloader:ci
          /repo/tests/config-test.sh /terraria-server/prepare-config.sh

      - name: Test console log filtering and crash replay
        run: >-
          docker run --rm --user tml:tml --entrypoint bash
          --mount type=bind,source="$PWD",target=/repo,readonly
          tmodloader:ci
          /repo/tests/log-filter-test.sh /terraria-server/log-filter.sh /terraria-server/run-server.sh

      - name: Test direct console control
        run: >-
          docker run --rm --user tml:tml --entrypoint bash
          --mount type=bind,source="$PWD",target=/repo,readonly
          tmodloader:ci
          /repo/tests/runtime-control-test.sh /usr/local/bin/inject

      - name: Smoke-test the server
        timeout-minutes: 12
        run: bash tests/server-smoke-test.sh tmodloader:ci

      - name: Test real-server backup and restore
        timeout-minutes: 15
        run: sudo python3 tests/backup-integration-test.py tmodloader:ci

      - name: Test real-server administration controls
        timeout-minutes: 15
        run: sudo python3 tests/admin-integration-test.py tmodloader:ci
