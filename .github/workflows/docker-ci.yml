name: Docker CI

on:
  push:
    branches-ignore:
      - master
    paths:
      - VERSION
      - CHANGELOG.md
      - Dockerfile
      - "*.sh"
      - "tests/**"
      - docker-compose.yml
      - ".github/workflows/*.yml"
  pull_request:
    paths:
      - VERSION
      - CHANGELOG.md
      - Dockerfile
      - "*.sh"
      - "tests/**"
      - docker-compose.yml
      - ".github/workflows/*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate shell syntax
        run: bash -n ./*.sh tests/*.sh

      - name: Lint runtime scripts
        run: shellcheck --severity=warning autosave.sh entrypoint.sh healthcheck.sh inject.sh log-filter.sh manage-mods.sh prepare-config.sh release-metadata.sh release-notes.sh run-server.sh tests/*.sh

      - name: Test release metadata and notes
        run: bash tests/release-metadata-test.sh

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: tmodloader:ci
          cache-from: type=gha,scope=ci

      - name: Test Workshop mod management
        run: >-
          docker run --rm --entrypoint bash
          --mount type=bind,source="$PWD",target=/repo,readonly
          tmodloader:ci
          /repo/tests/manage-mods-test.sh /terraria-server/manage-mods.sh

      - name: Test configuration generation
        run: >-
          docker run --rm --entrypoint bash
          --mount type=bind,source="$PWD",target=/repo,readonly
          tmodloader:ci
          /repo/tests/config-test.sh /terraria-server/prepare-config.sh

      - name: Test console log filtering and crash replay
        run: >-
          docker run --rm --entrypoint bash
          --mount type=bind,source="$PWD",target=/repo,readonly
          tmodloader:ci
          /repo/tests/log-filter-test.sh /terraria-server/log-filter.sh /terraria-server/run-server.sh

      - name: Test direct console control
        run: >-
          docker run --rm --entrypoint bash
          --mount type=bind,source="$PWD",target=/repo,readonly
          tmodloader:ci
          /repo/tests/runtime-control-test.sh /usr/local/bin/inject

      - name: Smoke-test the server
        timeout-minutes: 12
        run: bash tests/server-smoke-test.sh tmodloader:ci
