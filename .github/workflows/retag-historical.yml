name: Retag historical releases
on:
  push:
    branches:
      - codex/retag-historical-releases
    paths:
      - .github/workflows/retag-historical.yml
      - .github/maintenance/**
permissions:
  contents: write
  packages: write
concurrency:
  group: publish-tmodloader-images
  cancel-in-progress: false
jobs:
  retag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply verified historical retag plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/maintenance/retag.py apply
      - name: Save migration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-release-retag-results
          path: |
            .github/maintenance/applied.jsonl
            .github/maintenance/verification.json
