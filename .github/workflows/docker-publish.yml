name: Publish tModLoader images and releases

on:
  push:
    branches:
      - master
    paths:
      - VERSION
      - Dockerfile
      - "*.sh"
      - .github/workflows/docker-publish.yml
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: publish-tmodloader-images
  cancel-in-progress: false

jobs:
  releases:
    name: Resolve upstream releases
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.resolve.outputs.image }}
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Resolve stable and preview versions
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          releases="$({
            curl --fail-with-body --silent --show-error --location \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/tModLoader/tModLoader/releases?per_page=100"
          })"

          stable="$(jq -er '[.[] | select(.draft == false and .prerelease == false)][0].tag_name' <<<"$releases")"
          preview="$(jq -er '[.[] | select(.draft == false)][0].tag_name' <<<"$releases")"

          matrix="$(
            jq --compact-output --null-input \
              --arg stable "$stable" \
              --arg preview "$preview" \
              '{include: [
                  {channel: "stable", tml_version: $stable},
                  (if $preview != $stable then
                    {channel: "preview", tml_version: $preview}
                  else empty end)
                ]}'
          )"

          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/tmodloader" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Stable release: $stable"
          echo "Newest release: $preview"

  publish:
    name: Publish ${{ matrix.channel }} (${{ matrix.tml_version }})
    needs: releases
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.releases.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve composite release metadata
        id: metadata
        env:
          CHANNEL: ${{ matrix.channel }}
          TMODLOADER_VERSION: ${{ matrix.tml_version }}
        run: |
          container_version="$(tr -d '\r\n' < VERSION)"
          bash release-metadata.sh "$container_version" "$TMODLOADER_VERSION" "$CHANNEL"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Protect exact release tags
        id: publication
        env:
          DOCKER_TAG: ${{ steps.metadata.outputs.docker_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.releases.outputs.image }}
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
        run: |
          set -euo pipefail
          image_exists=false
          release_exists=false

          if docker buildx imagetools inspect "$IMAGE:$DOCKER_TAG" >/dev/null 2>&1; then
            image_exists=true
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_exists=true
          fi

          if [[ "$image_exists" == true && "$release_exists" == true ]]; then
            if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "$RELEASE_TAG is already complete; skipping the scheduled build."
              exit 0
            fi
            echo "Exact release $RELEASE_TAG already exists. Bump VERSION for container changes." >&2
            exit 1
          fi
          if [[ "$image_exists" != "$release_exists" ]]; then
            echo "Incomplete prior publication for $RELEASE_TAG; reconcile its image and GitHub Release before retrying." >&2
            exit 1
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Validate repository
        if: steps.publication.outputs.publish == 'true'
        run: |
          bash -n ./*.sh tests/*.sh
          shellcheck --severity=warning autosave.sh entrypoint.sh healthcheck.sh inject.sh log-filter.sh manage-mods.sh prepare-config.sh release-metadata.sh release-notes.sh run-server.sh tests/*.sh
          bash tests/release-metadata-test.sh
          docker compose config --quiet

      - name: Build and publish untagged candidate
        id: build
        if: steps.publication.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            TMOD_VERSION=${{ matrix.tml_version }}
          outputs: type=image,name=${{ needs.releases.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.metadata.outputs.release_tag }}
            org.opencontainers.image.title=tModLoader dedicated server
            io.github.crosis47.container.version=${{ steps.metadata.outputs.container_version }}
            io.github.crosis47.tmodloader.version=${{ matrix.tml_version }}
            io.github.crosis47.release.channel=${{ matrix.channel }}
          cache-from: type=gha,scope=${{ matrix.channel }}
          cache-to: type=gha,mode=max,scope=${{ matrix.channel }}
          provenance: mode=max
          sbom: true

      - name: Test candidate scripts
        if: steps.publication.outputs.publish == 'true'
        env:
          IMAGE: ${{ needs.releases.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker run --rm --entrypoint bash \
            --mount type=bind,source="$PWD",target=/repo,readonly \
            "$IMAGE@$DIGEST" \
            /repo/tests/manage-mods-test.sh /terraria-server/manage-mods.sh
          docker run --rm --entrypoint bash \
            --mount type=bind,source="$PWD",target=/repo,readonly \
            "$IMAGE@$DIGEST" \
            /repo/tests/config-test.sh /terraria-server/prepare-config.sh
          docker run --rm --entrypoint bash \
            --mount type=bind,source="$PWD",target=/repo,readonly \
            "$IMAGE@$DIGEST" \
            /repo/tests/log-filter-test.sh /terraria-server/log-filter.sh /terraria-server/run-server.sh
          docker run --rm --entrypoint bash \
            --mount type=bind,source="$PWD",target=/repo,readonly \
            "$IMAGE@$DIGEST" \
            /repo/tests/runtime-control-test.sh /usr/local/bin/inject

      - name: Smoke-test candidate server
        if: steps.publication.outputs.publish == 'true'
        env:
          IMAGE: ${{ needs.releases.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: bash tests/server-smoke-test.sh "$IMAGE@$DIGEST"

      - name: Publish verified image tags
        if: steps.publication.outputs.publish == 'true'
        env:
          CHANNEL: ${{ matrix.channel }}
          DIGEST: ${{ steps.build.outputs.digest }}
          DOCKER_TAG: ${{ steps.metadata.outputs.docker_tag }}
          IMAGE: ${{ needs.releases.outputs.image }}
          LEGACY_TAG: ${{ steps.metadata.outputs.legacy_tag }}
          TMODLOADER_TAG: ${{ steps.metadata.outputs.tml_tag }}
        run: |
          tag_args=(
            --tag "$IMAGE:$DOCKER_TAG"
            --tag "$IMAGE:$TMODLOADER_TAG"
            --tag "$IMAGE:$LEGACY_TAG"
          )
          if [[ "$CHANNEL" == stable ]]; then
            tag_args+=(--tag "$IMAGE:latest" --tag "$IMAGE:stable")
          else
            tag_args+=(--tag "$IMAGE:preview")
          fi
          docker buildx imagetools create "${tag_args[@]}" "$IMAGE@$DIGEST"

      - name: Render GitHub Release notes
        if: steps.publication.outputs.publish == 'true'
        env:
          CHANNEL: ${{ matrix.channel }}
          CONTAINER_VERSION: ${{ steps.metadata.outputs.container_version }}
          DIGEST: ${{ steps.build.outputs.digest }}
          DOCKER_TAG: ${{ steps.metadata.outputs.docker_tag }}
          IMAGE: ${{ needs.releases.outputs.image }}
          TMODLOADER_TAG: ${{ steps.metadata.outputs.tml_tag }}
          TMODLOADER_VERSION: ${{ matrix.tml_version }}
        run: |
          bash release-notes.sh \
            "$CONTAINER_VERSION" \
            "$TMODLOADER_VERSION" \
            "$CHANNEL" \
            "$IMAGE" \
            "$DIGEST" \
            "$DOCKER_TAG" \
            "$TMODLOADER_TAG" \
            true \
            > "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub Release
        if: steps.publication.outputs.publish == 'true'
        env:
          CHANNEL: ${{ matrix.channel }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.metadata.outputs.release_title }}
        run: |
          release_args=(
            "$RELEASE_TAG"
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "$RELEASE_TITLE"
            --notes-file "$RUNNER_TEMP/release-notes.md"
          )
          if [[ "$CHANNEL" == preview ]]; then
            release_args+=(--prerelease --latest=false)
          else
            release_args+=(--latest)
          fi
          gh release create "${release_args[@]}"
