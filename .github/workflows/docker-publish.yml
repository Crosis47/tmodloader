name: Publish tModLoader images

on:
  push:
    branches:
      - master
    paths:
      - Dockerfile
      - "*.sh"
      - .github/workflows/docker-publish.yml
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-tmodloader-images
  cancel-in-progress: false

jobs:
  releases:
    name: Resolve upstream releases
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.resolve.outputs.image }}
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Resolve stable and preview versions
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          releases="$({
            curl --fail-with-body --silent --show-error --location \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/tModLoader/tModLoader/releases?per_page=100"
          })"

          stable="$(jq -er '[.[] | select(.draft == false and .prerelease == false)][0].tag_name' <<<"$releases")"
          preview="$(jq -er '[.[] | select(.draft == false)][0].tag_name' <<<"$releases")"

          matrix="$(
            jq --compact-output --null-input \
              --arg stable "$stable" \
              --arg preview "$preview" \
              '{include: [
                  {channel: "stable", version: $stable, floating: "latest"},
                  (if $preview != $stable then
                    {channel: "preview", version: $preview, floating: "preview"}
                  else empty end)
                ]}'
          )"

          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/tmodloader" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Stable release: $stable"
          echo "Newest release: $preview"

  publish:
    name: Publish ${{ matrix.channel }} (${{ matrix.version }})
    needs: releases
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.releases.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether scheduled version is already published
        id: publication
        env:
          IMAGE: ${{ needs.releases.outputs.image }}
          VERSION: ${{ matrix.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]] && \
             docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$IMAGE:$VERSION already exists; skipping the scheduled rebuild."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish image
        if: steps.publication.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            TMOD_VERSION=${{ matrix.version }}
          tags: |
            ${{ needs.releases.outputs.image }}:${{ matrix.version }}
            ${{ needs.releases.outputs.image }}:${{ matrix.floating }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ matrix.version }}
            org.opencontainers.image.title=tModLoader dedicated server
          cache-from: type=gha,scope=${{ matrix.channel }}
          cache-to: type=gha,mode=max,scope=${{ matrix.channel }}
          provenance: mode=max
          sbom: true
