name: Publish a custom tModLoader release

on:
  workflow_dispatch:
    inputs:
      release:
        description: Exact tModLoader release tag, such as v2026.07.3.0
        required: true
        type: string
      floating_tag:
        description: Optionally move a floating tag to this release
        required: true
        default: version-only
        type: choice
        options:
          - version-only
          - latest
          - preview

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-tmodloader-images
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate release and prepare tags
        id: release
        env:
          RELEASE: ${{ inputs.release }}
          FLOATING_TAG: ${{ inputs.floating_tag }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE" =~ ^v[0-9]{4}\.[0-9]{1,2}\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tModLoader release tag: $RELEASE" >&2
            exit 1
          fi

          curl --fail --silent --show-error --location --head \
            "https://github.com/tModLoader/tModLoader/releases/download/${RELEASE}/tModLoader.zip" \
            >/dev/null

          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/tmodloader"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "floating=$FLOATING_TAG" >> "$GITHUB_OUTPUT"

      - name: Validate repository
        run: |
          bash -n ./*.sh tests/*.sh
          shellcheck --severity=warning autosave.sh entrypoint.sh healthcheck.sh inject.sh manage-mods.sh prepare-config.sh run-server.sh tests/*.sh
          docker compose config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish untagged candidate
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            TMOD_VERSION=${{ inputs.release }}
          outputs: type=image,name=${{ steps.release.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.release }}
            org.opencontainers.image.title=tModLoader dedicated server
          cache-from: type=gha,scope=custom
          cache-to: type=gha,mode=max,scope=custom
          provenance: mode=max
          sbom: true

      - name: Test candidate scripts
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker run --rm --entrypoint bash \
            --mount type=bind,source="$PWD",target=/repo,readonly \
            "$IMAGE@$DIGEST" \
            /repo/tests/manage-mods-test.sh /terraria-server/manage-mods.sh
          docker run --rm --entrypoint bash \
            --mount type=bind,source="$PWD",target=/repo,readonly \
            "$IMAGE@$DIGEST" \
            /repo/tests/config-test.sh /terraria-server/prepare-config.sh

      - name: Smoke-test candidate server
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: bash tests/server-smoke-test.sh "$IMAGE@$DIGEST"

      - name: Publish verified tags
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE: ${{ inputs.release }}
          FLOATING: ${{ steps.release.outputs.floating }}
        run: |
          tag_args=(--tag "$IMAGE:$RELEASE")
          if [[ "$FLOATING" != "version-only" ]]; then
            tag_args+=(--tag "$IMAGE:$FLOATING")
          fi
          docker buildx imagetools create "${tag_args[@]}" "$IMAGE@$DIGEST"
