name: Publish a custom tModLoader release

on:
  workflow_dispatch:
    inputs:
      release:
        description: Exact tModLoader release tag, such as v2026.07.3.0
        required: true
        type: string
      floating_tag:
        description: Optionally move a floating tag to this release
        required: true
        default: version-only
        type: choice
        options:
          - version-only
          - latest
          - preview

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-tmodloader-images
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate release and prepare tags
        id: release
        env:
          RELEASE: ${{ inputs.release }}
          FLOATING_TAG: ${{ inputs.floating_tag }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE" =~ ^v[0-9]{4}\.[0-9]{1,2}\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tModLoader release tag: $RELEASE" >&2
            exit 1
          fi

          curl --fail --silent --show-error --location --head \
            "https://github.com/tModLoader/tModLoader/releases/download/${RELEASE}/tModLoader.zip" \
            >/dev/null

          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/tmodloader"
          {
            echo 'tags<<EOF'
            echo "$image:$RELEASE"
            if [[ "$FLOATING_TAG" != "version-only" ]]; then
              echo "$image:$FLOATING_TAG"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            TMOD_VERSION=${{ inputs.release }}
          tags: ${{ steps.release.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.release }}
            org.opencontainers.image.title=tModLoader dedicated server
          cache-from: type=gha,scope=custom
          cache-to: type=gha,mode=max,scope=custom
          provenance: mode=max
          sbom: true
