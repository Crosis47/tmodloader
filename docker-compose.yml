services:
  tmodloader:
    image: ghcr.io/crosis47/tmodloader:latest
    pull_policy: always
    container_name: tmodloader
    restart: unless-stopped
    stop_grace_period: 2m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      # MonoMod writes a short-lived native helper here and requires executable mappings.
      - /tmp:rw,exec,nosuid,nodev,size=64m,mode=1777
    ports:
      # TMOD_HOST_PORT is the host-facing port; TMOD_PORT is the port inside the container.
      - "${TMOD_HOST_PORT:-7777}:${TMOD_PORT:-7777}/tcp"
    environment:
      # Copy .env.example to .env and make deployment-specific changes there.
      TMOD_MODS: "${TMOD_MODS:-}"
      TMOD_DOWNLOAD_RETRIES: "${TMOD_DOWNLOAD_RETRIES:-3}"
      TMOD_DOWNLOAD_RETRY_DELAY: "${TMOD_DOWNLOAD_RETRY_DELAY:-10}"
      TMOD_MOD_OFFLINE_POLICY: "${TMOD_MOD_OFFLINE_POLICY:-use-cache}"
      TMOD_COLLECTION_MAX_ITEMS: "${TMOD_COLLECTION_MAX_ITEMS:-1000}"
      TMOD_SHUTDOWN_MESSAGE: "${TMOD_SHUTDOWN_MESSAGE:-Server is shutting down NOW!}"
      TMOD_SHUTDOWN_TIMEOUT: "${TMOD_SHUTDOWN_TIMEOUT:-90}"
      TMOD_AUTOSAVE_INTERVAL: "${TMOD_AUTOSAVE_INTERVAL:-10}"
      TMOD_LOG_LEVEL: "${TMOD_LOG_LEVEL:-normal}"
      TMOD_CRASH_LOG_LINES: "${TMOD_CRASH_LOG_LINES:-200}"
      TMOD_USECONFIGFILE: "${TMOD_USECONFIGFILE:-No}"
      TMOD_MOTD: "${TMOD_MOTD:-A tModLoader server powered by Docker!}"
      TMOD_PASS: "${TMOD_PASS:-N/A}"
      TMOD_PASS_FILE: "${TMOD_PASS_FILE:-}"
      TMOD_MAXPLAYERS: "${TMOD_MAXPLAYERS:-8}"
      TMOD_WORLDNAME: "${TMOD_WORLDNAME:-Docker}"
      TMOD_WORLDSIZE: "${TMOD_WORLDSIZE:-3}"
      TMOD_WORLDSEED: "${TMOD_WORLDSEED:-Docker}"
      TMOD_DIFFICULTY: "${TMOD_DIFFICULTY:-1}"
      TMOD_SECURE: "${TMOD_SECURE:-0}"
      TMOD_LANGUAGE: "${TMOD_LANGUAGE:-en-US}"
      TMOD_NPCSTREAM: "${TMOD_NPCSTREAM:-60}"
      TMOD_UPNP: "${TMOD_UPNP:-0}"
      TMOD_PRIORITY: "${TMOD_PRIORITY:-1}"
      TMOD_PORT: "${TMOD_PORT:-7777}"
      TMOD_JOURNEY_SETFROZEN: "${TMOD_JOURNEY_SETFROZEN:-0}"
      TMOD_JOURNEY_SETDAWN: "${TMOD_JOURNEY_SETDAWN:-0}"
      TMOD_JOURNEY_SETNOON: "${TMOD_JOURNEY_SETNOON:-0}"
      TMOD_JOURNEY_SETDUSK: "${TMOD_JOURNEY_SETDUSK:-0}"
      TMOD_JOURNEY_SETMIDNIGHT: "${TMOD_JOURNEY_SETMIDNIGHT:-0}"
      TMOD_JOURNEY_GODMODE: "${TMOD_JOURNEY_GODMODE:-0}"
      TMOD_JOURNEY_WIND_STRENGTH: "${TMOD_JOURNEY_WIND_STRENGTH:-0}"
      TMOD_JOURNEY_RAIN_STRENGTH: "${TMOD_JOURNEY_RAIN_STRENGTH:-0}"
      TMOD_JOURNEY_TIME_SPEED: "${TMOD_JOURNEY_TIME_SPEED:-0}"
      TMOD_JOURNEY_RAIN_FROZEN: "${TMOD_JOURNEY_RAIN_FROZEN:-0}"
      TMOD_JOURNEY_WIND_FROZEN: "${TMOD_JOURNEY_WIND_FROZEN:-0}"
      TMOD_JOURNEY_PLACEMENT_RANGE: "${TMOD_JOURNEY_PLACEMENT_RANGE:-0}"
      TMOD_JOURNEY_SET_DIFFICULTY: "${TMOD_JOURNEY_SET_DIFFICULTY:-0}"
      TMOD_JOURNEY_BIOME_SPREAD: "${TMOD_JOURNEY_BIOME_SPREAD:-0}"
      TMOD_JOURNEY_SPAWN_RATE: "${TMOD_JOURNEY_SPAWN_RATE:-0}"

    volumes:
      # On Linux, create ./data with ownership 1000:1000 before starting.
      - "./data:/data"
      # For TMOD_USECONFIGFILE=Yes:
      # - "./customconfig.txt:/terraria-server/customconfig.txt:ro"
      # For TMOD_PASS_FILE=/run/secrets/tmod-password:
      # - "./secrets/tmod-password:/run/secrets/tmod-password:ro"
