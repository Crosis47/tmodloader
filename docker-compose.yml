# Copy .env.example to .env, then run docker compose up -d.
# WebUI: http://SERVER-IP:8080. First-run setup code: docker compose logs tmodloader.
# To opt out, set TMOD_WEB_ENABLED=0 in .env. No setup is required when disabled.
services:
  tmodloader:
    image: ghcr.io/crosis47/tmodloader:latest
    restart: unless-stopped
    stop_grace_period: 2m
    # Settings live in .env; the image handles ownership repair and privilege drop.
    env_file: .env
    ports:
      - "${TMOD_HOST_PORT:-7777}:${TMOD_PORT:-7777}/tcp"
      # HTTP for RFC 1918 clients; use an HTTPS proxy for public clients.
      - "${TMOD_WEB_HOST_PORT:-8080}:8080/tcp"
    volumes:
      - "./data:/data"
      - "./backups:/backups"
      # Optional file inputs: set the matching *_FILE setting in .env.
      # - "./secrets/tmod-admin-token:/run/secrets/tmod-admin-token:ro"
      # - "./secrets/steam-api-key:/run/secrets/steam-api-key:ro"
      # - "./secrets/tmod-password:/run/secrets/tmod-password:ro"
      # For TMOD_USECONFIGFILE=Yes:
      # - "./customconfig.txt:/terraria-server/customconfig.txt:ro"
